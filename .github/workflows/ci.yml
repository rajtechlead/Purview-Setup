name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test-publish:
    name: Build, test and publish (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PurviewGovernanceCopilot.sln

      - name: Build (Release)
        run: dotnet build PurviewGovernanceCopilot.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/PurviewCopilot.Tests/PurviewCopilot.Tests.csproj
          -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Vulnerability scan
        run: dotnet list PurviewGovernanceCopilot.sln package --vulnerable --include-transitive

      - name: Publish
        run: >
          dotnet publish src/PurviewCopilot.UI/PurviewCopilot.UI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/publish

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/PurviewCopilot.Tests/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: PurviewGovernanceCopilot-win-x64
          path: artifacts/publish/
          retention-days: 14

      - name: Build MSIX (unsigned)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/msix/Build-Msix.ps1 -PublishDir artifacts/publish -Version 1.0.0.0

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: PurviewGovernanceCopilot-msix
          path: |
            dist/*.msix
            dist/*.msix.sha256
          retention-days: 14

      # Code signing is required for production releases.
      # Configure a certificate in repository secrets and enable this step:
      #
      # - name: Sign executable
      #   if: startsWith(github.ref, 'refs/tags/')
      #   run: |
      #     signtool sign /fd SHA256 /f ${{ secrets.SIGNING_CERT_PATH }} `
      #       /p ${{ secrets.SIGNING_CERT_PASSWORD }} `
      #       /tr http://timestamp.digicert.com /td SHA256 `
            #     artifacts/publish/PurviewGovernanceCopilot.exe
      #     dist/PurviewGovernanceCopilot-1.0.0.0.msix
